# The Site Configuration

theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Shanghai

# -----------------------------------------------------------------------------
# Basic information
# -----------------------------------------------------------------------------

title: Fengji Li 李沣骥

tagline: Postdoctoral Researcher · Assistant Researcher @ Beihang University, Beijing, China.

description: >-
  Personal academic website of Fengji Li (李沣骥),
  focusing on biomedical engineering, physiological speech interfaces,
  flexible ultrasound, and multimodal speech decoding.

# Your custom domain, without trailing "/"
url: "https://lifengji.com"

# Keep empty because the website is hosted at the root domain
baseurl: ""

# -----------------------------------------------------------------------------
# GitHub
# -----------------------------------------------------------------------------

github:
  username: lifengji

# -----------------------------------------------------------------------------
# Social Information
# -----------------------------------------------------------------------------

social:
  # Default author name and copyright owner
  name: Fengji Li

  # Contact email
  email: lifengji@buaa.edu.cn

  # Social / academic links
  links:
    - https://github.com/lifengji
    # - https://scholar.google.com/citations?user=YOUR_ID
    # - https://orcid.org/YOUR-ORCID
    # - https://www.linkedin.com/in/YOUR_USERNAME

# -----------------------------------------------------------------------------
# Site Verification
# -----------------------------------------------------------------------------
#
# Configure these later when you register the website with
# Google Search Console, Bing Webmaster Tools, Baidu, etc.
#
# webmaster_verifications:
#   google:
#   bing:
#   alexa:
#   yandex:
#   baidu:
#   facebook:

# -----------------------------------------------------------------------------
# Web Analytics
# -----------------------------------------------------------------------------
#
# Leave disabled for now.
# You can enable Google Analytics or another service later.
#
# analytics:
#   google:
#     id:
#   goatcounter:
#     id:
#   umami:
#     id:
#     domain:
#   matomo:
#     id:
#     domain:
#   cloudflare:
#     id:
#   fathom:
#     id:

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

# Page views
pageviews:
  provider: # currently supports 'goatcounter'

# Prefer color scheme
#
# Leave empty:
#   follow system preference + allow user to switch
#
# Options:
#   light
#   dark
theme_mode:

# CDN endpoint for media resources
# Leave empty unless you use a CDN
cdn:

# Sidebar avatar
avatar: /assets/img/avatar.jpg

# Social sharing preview image
#
# Recommended later:
# 1200 × 630 px image
#
# Example:
# social_preview_image: /assets/img/social-preview.png
social_preview_image:

# Global switch for TOC in posts
toc: true

# -----------------------------------------------------------------------------
# Post Actions
# -----------------------------------------------------------------------------

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------
#
# Keep provider empty to disable comments.
#

comments:
  provider: # [disqus | utterances | giscus]

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# -----------------------------------------------------------------------------
# Static Assets
# -----------------------------------------------------------------------------

assets:
  self_host:
    enabled:
    env:

# -----------------------------------------------------------------------------
# PWA
# -----------------------------------------------------------------------------
#
# Temporarily disabled while the website is under active development.
# This avoids aggressive caching of favicon, CSS, images, etc.
#
# You can change both to true after the website is stable.
#

pwa:
  enabled: false
  cache:
    enabled: false
    deny_paths:
      # - "/example"

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------

paginate: 10

# =============================================================================
# The following options are Chirpy/Jekyll defaults.
# Normally do not modify them.
# =============================================================================

kramdown:
  footnote_backlink: "↩︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # DO NOT modify unless you also update all post links
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
